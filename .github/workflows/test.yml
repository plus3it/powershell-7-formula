name: Run test jobs
on:
  pull_request:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: plus3it/actions-workflows/.github/workflows/test.yml@a6e41877e630b2e3f15b265c2567cfb1076b1346

  linux:
    uses: plus3it/actions-workflows/.github/workflows/test-salt-linux.yml@a6e41877e630b2e3f15b265c2567cfb1076b1346
    strategy:
      matrix:
        os_version:
          - 8
          - 9
        salt_state:
          - powershell-7
        salt_pillar_root:
          - ./tests/pillar/test-linux-main
    with:
      salt-os-version: ${{ matrix.os_version }}
      salt-state: ${{ matrix.salt_state }}
      salt-pillar-root: ${{ matrix.salt_pillar_root }}

  windows:
    uses: plus3it/actions-workflows/.github/workflows/test-salt-windows.yml@a6e41877e630b2e3f15b265c2567cfb1076b1346
    strategy:
      matrix:
        os_version:
          - windows-2019
          - windows-2022
          - windows-2025
        salt_state:
          - powershell-7
        salt_pillar_root:
          - ./tests/pillar/test-powershell-7
    with:
      salt-os-version: ${{ matrix.os_version }}
      salt-state: ${{ matrix.salt_state }}
      salt-pillar-root: ${{ matrix.salt_pillar_root }}
